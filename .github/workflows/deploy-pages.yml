name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a newer push cancels an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds every built-in napplet, then bundles the stlstr app into
      # apps/stlstr/dist. A default VITE_DEV_PRIVKEY_HEX is baked into the
      # napplet:build script, so no secret is required for the build.
      - run: pnpm app:build

      # SPA fallback: BrowserRouter deep-links (e.g. /napplet/xyz) 404 on a hard
      # refresh unless Pages serves index.html for unknown paths. A 404.html
      # copy makes GitHub Pages return the app shell for any client route.
      - run: cp apps/stlstr/dist/index.html apps/stlstr/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/stlstr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
